<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Auto Wala — Indian Auto Ride Radio</title>
  <meta name="description" content="Auto Wala — a moving Indian auto-rickshaw radio experience with horn sets and an Auto Wala playlist." />
  <meta name="theme-color" content="#0e5b3d" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --green: #0d5c3d;
      --green-2: #123e30;
      --yellow: #ffd329;
      --yellow-2: #f5a900;
      --cream: #fff7d6;
      --ink: #101b18;
      --glass: rgba(14, 54, 43, .55);
      --glass-2: rgba(0, 0, 0, .22);
      --line: rgba(255,255,255,.24);
      --text: #fffdf2;
      --muted: rgba(255,255,255,.68);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      height: 100svh;
      margin: 0;
      background: #071018;
      color: var(--text);
      font-family: "Baloo 2", system-ui, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      height: 100svh;
      max-height: 100svh;
      overflow: hidden;
      background: #071018;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .08;
      mix-blend-mode: soft-light;
      z-index: 2;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
    }

    .page {
      position: relative;
      height: 100svh;
      max-height: 100svh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      isolation: isolate;
      overflow: hidden;
      background: transparent;
      z-index: 3;
    }

    .topbar {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 14px 28px 0;
      z-index: 10;
    }

    .clock {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .02em;
      justify-self: start;
    }

    .presence {
      justify-self: center;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 15px;
    }

    .presence strong { color: white; font-size: 16px; font-weight: 700; }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #4ee18b;
      box-shadow: 0 0 0 5px rgba(78,225,139,.14), 0 0 18px rgba(78,225,139,.65);
    }

    .playlist-link {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: white;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.3);
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(16px);
      border-radius: 999px;
      padding: 8px 13px;
      font-size: 13px;
    }

    .hero {
      position: relative;
      min-height: 0;
      height: 100%;
      display: grid;
      place-items: center;
      z-index: 1;
      overflow: hidden;
    }

    .hero__title {
      position: absolute;
      top: 3.5%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      margin: 0;
      text-align: center;
      font-family: "Noto Sans Devanagari", sans-serif;
      font-weight: 800;
      font-size: clamp(48px, 7.4vw, 118px);
      line-height: .9;
      color: #fff8d8;
      text-shadow: 0 4px 0 rgba(0,0,0,.08);
      white-space: nowrap;
    }

    .hero__subtitle {
      position: absolute;
      top: calc(3.5% + clamp(52px, 7.4vw, 118px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      margin: 15px 0 0;
      color: rgba(255,255,255,.66);
      font-size: clamp(12px, 1.3vw, 17px);
      letter-spacing: .2em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
      pointer-events: none;
    }

    .road-glow {
      display: none;
    }

    .horn-panel {
      position: absolute;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 8;
      width: 210px;
      padding: 14px;
      border: 1px solid var(--line);
      background: rgba(6, 30, 25, .42);
      backdrop-filter: blur(16px);
      border-radius: 22px;
      box-shadow: 0 18px 40px rgba(0,0,0,.18);
    }

    .horn-panel__title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 800;
    }

    .horn-panel__title span:first-child {
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--yellow);
      color: var(--ink);
    }

    .horn-set {
      display: grid;
      gap: 8px;
    }

    .horn-btn {
      width: 100%;
      border: 0;
      color: white;
      cursor: pointer;
      text-align: left;
      border-radius: 14px;
      padding: 10px 12px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.09);
      transition: transform .15s ease, background .15s ease;
      font: inherit;
    }

    .horn-btn:hover { transform: translateX(3px); background: rgba(255,255,255,.12); }
    .horn-btn strong { display: block; font-size: 14px; line-height: 1.1; }
    .horn-btn small { color: var(--muted); font-size: 11px; }

    .horn-btn.is-active {
      color: #172218;
      background: linear-gradient(135deg, var(--yellow), #ffeb7a);
      border-color: transparent;
    }

    .horn-btn.is-active small { color: rgba(23, 34, 24, .62); }

    .horn-main {
      width: 100%;
      margin-top: 10px;
      border: 0;
      border-radius: 15px;
      padding: 12px 14px;
      cursor: pointer;
      background: linear-gradient(135deg, #0f6a46, #0c4d36);
      color: white;
      font: inherit;
      font-weight: 800;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
    }

    .horn-main:active { transform: scale(.98); }

    .speed-chip {
      position: absolute;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 8;
      width: 150px;
      padding: 14px 16px;
      border-radius: 22px;
      background: rgba(6, 30, 25, .42);
      border: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }

    .speed-chip .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .16em; }
    .speed-chip .value { display: flex; align-items: baseline; gap: 5px; margin-top: 2px; }
    .speed-chip .value strong { font-size: 34px; line-height: 1; }
    .speed-chip .value span { color: var(--muted); font-size: 12px; }

    .dock-wrap {
      position: relative;
      z-index: 10;
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 0 0 max(12px, env(safe-area-inset-bottom));
    }

    .bumper {
      margin: 0 auto 8px;
      text-align: center;
      max-width: 720px;
      font-family: "Noto Sans Devanagari", sans-serif;
      color: #fff9db;
      font-size: clamp(14px, 1.7vw, 20px);
      line-height: 1.45;
      text-shadow: 0 2px 12px rgba(0,0,0,.45);
    }

    .player {
      display: grid;
      grid-template-columns: auto minmax(0,1fr) auto;
      align-items: center;
      gap: 16px;
      min-height: 86px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.28);
      background:
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03)),
        rgba(13, 64, 47, .62);
      backdrop-filter: blur(22px);
      box-shadow: 0 18px 60px rgba(0,0,0,.24);
    }

    .cover {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 50%, #1c1c1c 0 12%, transparent 13%),
        conic-gradient(from 0deg, #222, #444, #1a1a1a, #3d3d3d, #222);
      border: 3px solid rgba(255,255,255,.8);
      box-shadow: 0 5px 18px rgba(0,0,0,.28);
      position: relative;
      flex: 0 0 auto;
    }

    .cover::after {
      content: "AUTO";
      position: absolute;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 8px;
      font-weight: 800;
      color: #1a241c;
      background: var(--yellow);
    }

    .cover.is-playing { animation: spin 3s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .track-meta { min-width: 0; }

    .track-title {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      mask-image: linear-gradient(90deg, #000 78%, transparent);
    }

    .track-title span {
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: bottom;
    }

    .track-title.is-scrolling span {
      max-width: none;
      padding-right: 2.2em;
      animation: title-scroll 11s linear infinite;
    }

    @keyframes title-scroll {
      0%, 12% { transform: translateX(0); }
      100% { transform: translateX(-55%); }
    }

    .track-artist {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress {
      margin-top: 8px;
      height: 3px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,.16);
      cursor: pointer;
    }

    .progress > span {
      display: block;
      width: 26%;
      height: 100%;
      background: var(--yellow);
      border-radius: inherit;
    }

    .track-time {
      margin-top: 3px;
      color: rgba(255,255,255,.55);
      font-size: 10px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .control {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 0;
      color: white;
      background: transparent;
      cursor: pointer;
    }

    .control:hover { background: rgba(255,255,255,.1); }
    .control.is-on { color: var(--yellow); }

    .control.play {
      width: 50px;
      height: 50px;
      color: var(--ink);
      background: #fffaf0;
      box-shadow: 0 6px 18px rgba(0,0,0,.25);
    }

    .control svg { width: 18px; height: 18px; fill: currentColor; }

    #yt-host {
      position: fixed;
      width: 240px;
      height: 135px;
      left: 0;
      bottom: 0;
      overflow: hidden;
      pointer-events: none;
      opacity: 0.001;
      z-index: -1;
    }

    .playlist-sheet {
      position: fixed;
      right: 22px;
      bottom: max(96px, calc(env(safe-area-inset-bottom) + 86px));
      z-index: 30;
      width: min(390px, calc(100vw - 44px));
      max-height: min(48vh, calc(100svh - 160px));
      overflow: auto;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: rgba(7, 39, 31, .92);
      backdrop-filter: blur(24px);
      box-shadow: 0 28px 80px rgba(0,0,0,.35);
      transform: translateY(12px) scale(.98);
      opacity: 0;
      pointer-events: none;
      transition: .18s ease;
    }

    .playlist-sheet.is-open {
      transform: translateY(0) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .playlist-sheet header {
      position: sticky;
      top: 0;
      padding: 15px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(7,39,31,.95);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .playlist-sheet h2 { margin: 0; font-size: 16px; }
    .playlist-sheet h2 small { display: block; color: var(--muted); font-size: 11px; font-weight: 600; margin-top: 2px; }

    .tracks { list-style: none; margin: 0; padding: 6px; }

    .track-row {
      width: 100%;
      display: grid;
      grid-template-columns: 34px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: white;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }

    .track-row:hover { background: rgba(255,255,255,.07); }
    .track-row.is-current { background: rgba(255,211,41,.12); }

    .track-number {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      color: var(--yellow);
      font-size: 12px;
      font-weight: 800;
    }

    .track-row strong { display: block; font-size: 13px; }
    .track-row small { display: block; color: var(--muted); font-size: 11px; }
    .track-row time { color: var(--muted); font-size: 10px; }

    .mobile-horn { display: none; }

    @media (max-width: 850px) {
      .topbar { padding: 10px 16px 0; }
      .playlist-link span { display: none; }
      .horn-panel, .speed-chip { display: none; }
      .hero { min-height: 0; }
      .hero__title { top: 6%; font-size: clamp(40px, 12vw, 84px); }
      .hero__subtitle { top: calc(6% + clamp(44px, 12vw, 84px)); }
      .dock-wrap { margin-top: 0; }
      .mobile-horn {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin: 0 auto 8px;
      }
      .mobile-horn button {
        border: 1px solid rgba(255,255,255,.22);
        border-radius: 999px;
        background: rgba(0,0,0,.18);
        color: white;
        padding: 8px 11px;
        font: inherit;
        font-size: 12px;
      }
    }

    @media (max-width: 610px) {
      .topbar {
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "clock link"
          "presence presence";
        gap: 8px;
      }
      .clock { grid-area: clock; }
      .presence { grid-area: presence; justify-self: start; }
      .playlist-link { grid-area: link; }
      .hero { min-height: 0; }
      .player {
        border-radius: 24px;
        grid-template-columns: auto minmax(0,1fr);
        gap: 12px;
        padding: 11px;
        min-height: 0;
      }
      .controls {
        grid-column: 1 / -1;
        justify-content: center;
      }
      .cover { width: 58px; height: 58px; }
      .bumper { padding: 0 12px; font-size: 15px; }
    }

    @media (max-height: 780px) {
      .topbar { padding-top: 8px; gap: 10px; }
      .horn-panel, .speed-chip { transform: translateY(-50%) scale(.86); transform-origin: center; }
      .player { min-height: 72px; padding: 8px 12px; }
      .cover { width: 52px; height: 52px; }
      .control.play { width: 44px; height: 44px; }
      .bumper { margin-bottom: 6px; }
    }
  </style>
</head>

<body>
  <canvas id="scene" aria-label="Animated yellow and green Indian auto-rickshaw driving on a road"></canvas>
  <div class="grain"></div>

  <div class="page">
    <header class="topbar">
      <div class="clock" id="clock">7:20 pm</div>

      <div class="presence" aria-live="polite">
        <span class="dot"></span>
        <strong id="listeners">709</strong>
        <span>on the road</span>
      </div>

      <a class="playlist-link" href="#" id="playlistLink" aria-label="Open Auto Wala playlist">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M12 2a10 10 0 100 20 10 10 0 000-20zm-2.2 6.2l6.4 3.8-6.4 3.8V8.2z"/>
        </svg>
        <span>90s Bollywood Dance</span>
      </a>
    </header>

    <main class="hero">
      <h1 class="hero__title" lang="hi">ऑटो वाला</h1>
      <p class="hero__subtitle">meter down · music up</p>

      <aside class="horn-panel" aria-label="Horn">
        <p class="horn-panel__title">
          <span>📣</span>
          <span>Horn</span>
        </p>

        <div class="horn-set">
          <button class="horn-btn is-active" id="hornClip" type="button">
            <strong>Jaldi Waha Se Hato</strong>
            <small>the only horn that matters</small>
          </button>
        </div>

        <button class="horn-main" id="hornMain" type="button">HORN OK PLEASEEEE</button>
      </aside>

      <aside class="speed-chip" aria-label="Auto speed">
        <div class="label">Auto speed</div>
        <div class="value"><strong id="speed">38</strong><span>km/h</span></div>
      </aside>
    </main>

    <section class="dock-wrap">
      <div class="mobile-horn">
        <button id="hornMobile" type="button">📣 Jaldi Hato</button>
      </div>

      <p class="bumper" id="bumperText" lang="hi">मीटर से चलेंगे, दिल से सुनेंगे।</p>

      <div class="player">
        <div class="cover" id="cover"></div>

        <div class="track-meta">
          <div class="track-title" id="trackTitle"><span id="trackTitleText">90s Bollywood Dance</span></div>
          <div class="track-artist" id="trackArtist">Press play — songs keep changing on their own</div>
          <div class="progress" id="progress"><span id="progressFill"></span></div>
          <div class="track-time"><span id="currentTime">0:00</span> / <span id="duration">0:00</span></div>
        </div>

        <div class="controls">
          <button class="control" id="shuffle" aria-label="Shuffle">
            <svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.2l-2.3 3.1 2.3 3.1H17V11l4 4-4 4v-3h-3.2l-2.6-3.5L8.6 15H3v-2h4.6l2.6-3.5L12.8 6H17V3zM3 9h3.4l1.5 2H3V9z"/></svg>
          </button>

          <button class="control" id="prev" aria-label="Previous">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>

          <button class="control play" id="play" aria-label="Play">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>

          <button class="control" id="next" aria-label="Next">
            <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"/></svg>
          </button>

          <button class="control" id="listBtn" aria-label="Playlist">
            <svg viewBox="0 0 24 24"><path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3zm15-6.5l4 3-4 3z"/></svg>
          </button>
        </div>
      </div>
    </section>
  </div>

  <aside class="playlist-sheet" id="playlistSheet">
    <header>
      <h2>🛺 90s Bollywood Dance <small>Auto Wala radio · songs keep rolling</small></h2>
      <button class="control" id="closeList" aria-label="Close playlist">✕</button>
    </header>
    <ol class="tracks" id="tracks"></ol>
  </aside>

  <div id="yt-host" aria-hidden="true"><div id="yt-player"></div></div>

  <script>
    /* -----------------------------------------------------------
       AUTO WALA RADIO — 90s Bollywood Dance playlist
       https://music.youtube.com/playlist?list=RDCLAK5uy_kiDNaS5nAXxdzsqFElFKKKs0GUEFJE26w
       ----------------------------------------------------------- */
    const YT_PLAYLIST_ID = "RDCLAK5uy_kiDNaS5nAXxdzsqFElFKKKs0GUEFJE26w";
    const PLAYLIST_NAME = "90s Bollywood Dance";

    const BUMPER_LINES = [
      "मीटर से चलेंगे, दिल से सुनेंगे।",
      "हॉर्न कम, गाने ज़्यादा।",
      "जगह छोटी है, दिल बड़ा है।",
      "ऑटो हमारा, मूड तुम्हारा।",
      "भाई थोड़ा आगे बैठ जाना।",
      "ट्रैफिक अपना काम करेगा, हम अपना गाना सुनेंगे।",
      "किराया बाद में, प्लेलिस्ट पहले।"
    ];

    const $ = (id) => document.getElementById(id);
    const play = $("play");
    const playIcon = $("playIcon");
    const cover = $("cover");
    const titleWrap = $("trackTitle");
    const titleText = $("trackTitleText");
    const artist = $("trackArtist");
    const currentTimeEl = $("currentTime");
    const durationEl = $("duration");
    const progressFill = $("progressFill");
    const progress = $("progress");
    const playlistSheet = $("playlistSheet");
    const tracksEl = $("tracks");
    const shuffleBtn = $("shuffle");

    let yt = null;
    let ytReady = false;
    let playing = false;
    let shuffled = true;
    let currentTrack = 0;
    let playlistIds = [];
    const titleCache = Object.create(null);
    let bumperIndex = 0;

    function fmt(sec) {
      if (!Number.isFinite(sec) || sec < 0) sec = 0;
      const m = Math.floor(sec / 60);
      const s = String(Math.floor(sec % 60)).padStart(2, "0");
      return `${m}:${s}`;
    }

    function prettyTrack(data) {
      const raw = (data && data.title) || PLAYLIST_NAME;
      const author = ((data && data.author) || "YouTube Music").replace(/\s*-\s*Topic$/i, "").trim();
      const title = raw
        .split(/\s*[|•·]\s*/)[0]

      { p: 1.00, top: 0x1c2c6a, mid: 0xee7a48, horizon: 0xff8a42, ground: 0x4a2316, fog: 0xff8a52, hemiSky: 0xffc4a0, hemiGnd: 0x3a2214, key: 0xffb078, keyI: 3.4, moonI: 0, hemiI: 1.7, rim: 18, night: 0.08 }
    ];

    const mixA = new THREE.Color();
    const mixB = new THREE.Color();
    const midColorTarget = skyMat.uniforms.midColor.value;

    function sampleSky(phase) {
      let i = 0;
      while (i < SKY_STOPS.length - 1 && SKY_STOPS[i + 1].p < phase) i++;
      const a = SKY_STOPS[i];
      const b = SKY_STOPS[i + 1];
      const t = THREE.MathUtils.smoothstep((phase - a.p) / ((b.p - a.p) || 1), 0, 1);
      const num = (key) => a[key] + (b[key] - a[key]) * t;
      const col = (key, target) => target.set(a[key]).lerp(mixB.set(b[key]), t);
      return {
        top: col("top", skyMat.uniforms.topColor.value),
        mid: col("mid", midColorTarget),
        horizon: col("horizon", skyMat.uniforms.horizonColor.value),
        ground: col("ground", skyMat.uniforms.groundColor.value),
        fog: col("fog", mixA),
        hemiSky: a.hemiSky,
        hemiGnd: a.hemiGnd,
        hemiSkyB: b.hemiSky,
        hemiGndB: b.hemiGnd,
        key: a.key,
        keyB: b.key,
        t,
        keyI: num("keyI"),
        moonI: num("moonI"),
        hemiI: num("hemiI"),
        rim: num("rim"),
        night: num("night")
      };
    }

    function placeOnSkyArc(object, theta) {
      const elev = Math.max(0, Math.sin(theta));
      object.position.set(
        Math.cos(theta) * 32,
        3.4 + elev * 22,
        -20 - elev * 10
      );
    }

    function updateDayNight(elapsed) {
      const phase = (elapsed / DAY_SECONDS + CYCLE_START) % 1;
      const sunTheta = phase * Math.PI * 2;
      const moonTheta = sunTheta + Math.PI;
      const skyNow = sampleSky(phase);

      placeOnSkyArc(sun, sunTheta);
      placeOnSkyArc(moon, moonTheta);

      const sunUp = Math.sin(sunTheta);
      const moonUp = Math.sin(moonTheta);
      sun.visible = sunUp > -0.06;
      moon.visible = moonUp > -0.04;

      const elev = THREE.MathUtils.clamp(sunUp, 0, 1);
      const moonElev = THREE.MathUtils.clamp(moonUp, 0, 1);
      const horizon = 1 - elev;
      sun.userData.bloom.scale.setScalar(14 + horizon * 8);
      sun.userData.corona.scale.setScalar(7.4 + horizon * 3.6);
      sun.userData.disc.scale.setScalar(2.9 + horizon * 0.55);
      sun.userData.bloom.material.opacity = 0.22 + elev * 0.28 + horizon * 0.16;
      sun.userData.corona.material.opacity = 0.5 + elev * 0.35;
      sun.userData.disc.material.color.setRGB(1, 0.72 + elev * 0.26, 0.38 + elev * 0.52);

      moon.userData.halo.material.opacity = 0.28 + moonElev * 0.35;
      moon.userData.halo.scale.setScalar(9.2 + moonElev * 2.8);
      moon.rotation.y = elapsed * 0.03;

      const sunDir = skyMat.uniforms.sunDir.value.copy(sun.position).normalize();
      skyMat.uniforms.moonDir.value.copy(moon.position).normalize();
      skyMat.uniforms.sunGlow.value = THREE.MathUtils.clamp(sunUp * 1.6 + 0.08, 0, 1);
      skyMat.uniforms.moonGlow.value = THREE.MathUtils.clamp(moonUp * 1.5, 0, 1);
      skyMat.uniforms.night.value = skyNow.night;
      moon.userData.mat.uniforms.sunDir.value.copy(sunDir);

      key.position.copy(sun.position);
      moonLight.position.copy(moon.position);
      key.color.set(skyNow.key).lerp(mixB.set(skyNow.keyB), skyNow.t);
      key.intensity = skyNow.keyI * Math.max(0, sunUp + 0.04);
      moonLight.intensity = skyNow.moonI * Math.max(0, moonUp);
      hemi.color.set(skyNow.hemiSky).lerp(mixB.set(skyNow.hemiSkyB), skyNow.t);
      hemi.groundColor.set(skyNow.hemiGnd).lerp(mixB.set(skyNow.hemiGndB), skyNow.t);
      hemi.intensity = skyNow.hemiI;
      rim.intensity = skyNow.rim;
      rim.color.set(sunUp > 0.05 ? 0xff6a3a : 0x6a88ff);
      rim.position.set(sun.position.x * 0.28, 2.2, -4);

      scene.fog.color.copy(skyNow.fog);
      scene.fog.density = 0.007 + skyNow.night * 0.012;

      stars.material.opacity = skyNow.night * 0.92;
      stars.rotation.y = elapsed * 0.0035;

      lightDots.forEach((dot) => {
        dot.material.opacity = dot.userData.baseOpacity * (0.12 + skyNow.night * 0.9);
      });
      laneMat.emissiveIntensity = 0.18 + skyNow.night * 0.5;

      const head = auto.userData.headLight;
      const headMesh = auto.userData.headlightMesh;
      if (head) head.intensity = 18 + skyNow.night * 34;
      if (headMesh) headMesh.material.emissiveIntensity = 1.4 + skyNow.night * 3.2;

      renderer.setClearColor(skyNow.top, 1);
    }

    const greenMat = new THREE.MeshStandardMaterial({ color: 0x0f5a3c, roughness: .56, metalness: .06 });

    function box(w, h, d, mat, x = 0, y = 0, z = 0) {

      m.position.set((Math.random() - .5) * 30, 1 + Math.random() * 5, -7 - Math.random() * 8);
      m.material.transparent = true;
      m.material.opacity = .38 + Math.random() * .55;
      m.userData.baseOpacity = m.material.opacity;
      lightDots.push(m);
      scene.add(m);
    }

    let hornKick = 0;
    window.addEventListener("auto-honk", () => { hornKick = 1; });

    const clock = new THREE.Clock();
    let visualSpeed = 1;

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Ride motion
      auto.position.y = -.15 + Math.sin(t * 4.1) * .035;
      auto.rotation.z = Math.sin(t * 2.15) * .007;
      auto.rotation.x = Math.sin(t * 3.05) * .005;

      // subtle steering / forward motion
      auto.rotation.y = -.07 + Math.sin(t * .62) * .015;

      // horn recoil
      if (hornKick > .001) {
        hornKick *= .82;
        auto.position.x = -.35 - hornKick * .09;
        auto.rotation.z += hornKick * .018;
      } else {
        auto.position.x = -.35;
      }

      // wheel rotation
      auto.userData.wheels.forEach((wheel) => {
        wheel.rotation.z -= .095 * visualSpeed;
      });

      // Road scroll
      laneMarkers.forEach(marker => {
        marker.position.x -= .24 * visualSpeed;
        if (marker.position.x < -41) marker.position.x += 82;
      });

      posts.forEach(post => {
        post.position.x -= .30 * visualSpeed;
        if (post.position.x < -41) post.position.x += 82;
      });

      // speed meter gentle drift
      const kmh = Math.round(37 + Math.sin(t * .7) * 4 + Math.sin(t * 1.8) * 1.5);
      document.getElementById("speed").textContent = kmh;
      visualSpeed = .92 + (kmh - 32) / 28;

      // camera breathing
      camera.position.y = camBaseY + Math.sin(t * .45) * .04;
      camera.lookAt(.10, 1.52, 0);

      updateDayNight(t);

      renderer.render(scene, camera);
    }

    let camBaseY = 4.15;

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;

      if (w < 650) {
        camera.fov = 58;
        camera.position.set(0, 4.35, 15.6);
        camBaseY = 4.35;
        auto.scale.setScalar(.84);
        auto.position.z = .25;
      } else if (w < 900) {
        camera.fov = 50;
        camera.position.set(0, 4.22, 14.9);
        camBaseY = 4.22;
        auto.scale.setScalar(.94);
      } else {
        camera.fov = 44;
        camera.position.set(0, 4.12, 14.3);
        camBaseY = 4.12;
        auto.scale.setScalar(1.03);
      }

      camera.updateProjectionMatrix();
    }

    window.addEventListener("resize", resize);
    resize();
    animate();
  </script>
</body>
</html>
